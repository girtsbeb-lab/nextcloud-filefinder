services:
  db:
    image: mysql:8.4
    container_name: sertifikati-db
    restart: unless-stopped
    command: --skip-log-bin --innodb-buffer-pool-size=64M
    environment:
      TZ: Europe/Riga
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - dbdata:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: sertifikati
    restart: unless-stopped
    env_file: conf/.env
    environment:
      TZ: Europe/Riga
      DB_HOST: db
    volumes:
      - ./conf:/var/www/conf:ro
      - ./public:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:80"

volumes:
  dbdata:
